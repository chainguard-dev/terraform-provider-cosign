name: Tests

on:
  # pull_request_target is deliberate: fork PRs need the OIDC token for the
  # keyless signing tests, which plain pull_request does not grant them.
  # Untrusted fork code is gated behind the reviewer-approved
  # acceptance-tests environment, see the test job below.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.14.*"
          - "1.15.*"

    # Fork PRs must wait for reviewer approval on the acceptance-tests
    # environment before the job runs: it executes the PR's code with an
    # OIDC token for this repo. PRs from branches in this repo (write access
    # already) and push events run without approval. A PR whose head repo
    # was deleted has a null head.repo, so it is gated too.
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'acceptance-tests' || '' }}

    permissions:
      contents: read
      id-token: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            checkpoint-api.hashicorp.com:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: "contains(github.event_name, 'pull_request')"
        with:
          # checkout v7 refuses a fork PR ref under pull_request_target unless
          # this is set. The job needs the PR's merge commit to test it, and
          # limits the blast radius: fork PRs need acceptance-tests
          # environment approval, no workflow-level permissions,
          # contents:read plus the id-token:write the keyless signing tests
          # need, no persisted credentials, and harden-runner in block mode.
          allow-unsafe-pr-checkout: true
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          persist-credentials: false

      - name: checkout from push event
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: false
          check-latest: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: go mod download

      - run: go build -v .

      - run: TF_ACC=1 go test -v -cover ./internal/provider/

  check:
    permissions:
      actions: read
    needs:
      - test
    runs-on: ubuntu-latest
    if: always() # always run as required and if any dependent job is skipped, this is skipped if not always
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.blob.core.windows.net:443
            *.githubapp.com:443
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            checkpoint-api.hashicorp.com:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: step-security/workflow-conclusion-action@417a08214e364cc913458a2fab8aae827d1ba779 # v3.0.10

      - name: Handle conclusion
        env:
          CONCLUSION: ${{ env.WORKFLOW_CONCLUSION }}
        working-directory: /tmp
        run: |
          if [[ "${CONCLUSION}" == "success" ]]; then
            echo "${CONCLUSION}" && exit 0
          elif [[ "${CONCLUSION}" == "failure" ]]; then
            echo "${CONCLUSION}" && exit 1
          fi
